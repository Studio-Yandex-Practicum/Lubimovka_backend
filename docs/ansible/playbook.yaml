- name: Ping hosts
  hosts: lubimovka
  tasks:
    - name: Ping hosts
      ansible.builtin.ping:

- name: SSH Configuration
  hosts: lubimovka
  become: true
  tasks:
    - name: Disable password login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present
        backup: true
        validate: sshd -t -f %s
      register: password_login
    - name: Restart sshd
      service:
        name: ssh
        state: restarted
      when: password_login.changed

- name: Setup firewall
  hosts: lubimovka
  become: true
  tasks:
    - name: Install ufw
      apt:
       name: ufw
       state: latest
       update_cache: true
    - name: Add rules
      ufw:
        rule: allow
        direction: in
        port: "{{ item }}"
      loop:
        - ssh
        - http
        - https
        - smtp
    - name: Enable UFW
      ufw:
        state: enabled

- name: Setup fail2ban
  hosts: lubimovka
  become: true
  tasks:
    - name: Install fail2ban
      apt:
        name: fail2ban
        state: present
        update_cache: true
    - name: Start and enable fail2ban
      service:
        name: fail2ban
        state: started
        enabled: true

- name: Setup Docker
  hosts: lubimovka
  become: true
  tasks:
    - name: Install system packages
      apt:
        pkg:
          - ca-certificates
          - curl
          - gnupg
        state: latest
        update_cache: true
    - name: Add Docker GPG apy keys
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
    - name: Add Docker repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu jammy stable
        state: present
    - name: Update apt and install Docker
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: true
- name: Create user for Github Actions
  hosts: lubimovka
  become: true
  tasks:
    - name: Add servicemanagers group
      group:
        name: servicemanagers
        state: present
    - name: Add www-data group
      group:
        name: www-data
        state: present
    - name: Add user
      user:
        name: github
        groups: docker,servicemanagers,www-data
        group: docker
        state: present
        generate_ssh_key: true
        ssh_key_bits: 4096
        ssh_key_comment: Github
        ssh_key_file: .ssh/id_github_rsa
      register: user
    # Пакет polkit нужен для предоставления пользователю github доступа к запуску сервисов
    # Сценарий для версии polkit, работающей с файлами rules
    - name: Lookup Polkit .pkla folder
      ansible.builtin.stat:
        path: /etc/polkit-1/localauthority.conf.d/
      register: polkit_pkla_folder
    - name: Setup polkit part 1
      copy:
        owner: github
        content: |
          [Configuration]
          AdminIdentities=unix-group:servicemanagers
        dest: /etc/polkit-1/localauthority.conf.d/60-github-service.conf
      when: polkit_pkla_folder.stat.exists
    - name: Setup polkit part 2
      copy:
        owner: github
        content: |
          [Allow_service_operations]
          Identity=unix-group:servicemanagers
          Action=org.freedesktop.systemd1.*
          ResultAny=yes
        dest:  /etc/polkit-1/localauthority/50-local.d/10-com.lubimovka.github.service.pkla
      when: polkit_pkla_folder.stat.exists
    # Сценарий для версии polkit, работающей с файлами rules
    - name: Lookup Polkit rules folder
      ansible.builtin.stat:
        path: /etc/polkit-1/rules.d/
      register: polkit_rules_folder
    - name: Setup polkit with rules
      copy:
        owner: github
        content: |
          polkit.addRule(function(action, subject) {
              if (action.id.startsWith("org.freedesktop.systemd1.") &&
                  subject.isInGroup("servicemanagers")){
                  return polkit.Result.YES;
              }
          });
        dest: /etc/polkit-1/rules.d/10-com.lubimovka.github.service.rules
      when: polkit_rules_folder.stat.exists
    - name: Assert some polkit installation was found
      ansible.builtin.assert:
        that: polkit_pkla_folder.stat.exists or polkit_rules_folder.stat.exists
        fail_msg: "No Polkit installation found. Install Polkit on the server manually."
        success_msg: "Polkit folder found"
    - name: Copy public key
      copy:
        owner: "{{ user.name }}"
        content: "{{ user.ssh_public_key }}"
        dest: "{{ user.home }}/.ssh/authorized_keys"
    - name: Fetch private key
      fetch:
        src: "{{ user.ssh_key_file }}"
        dest: key/
        flat: true

- name: Create folder for the website"
  hosts: lubimovka
  become: true
  tasks:
    - name: Create folder
      file:
        path: /LUBIMOVKA
        owner: github
        group: docker
        mode: u=rwx,g=rx,o=rx
        state: directory

- name: Give github access to service folder
  hosts: lubimovka
  become: true
  tasks:
    - name: Install acl
      apt:
        name: acl
        state: present
    - name: Setup permissions
      ansible.posix.acl:
        path: /etc/systemd/system
        entity: github
        etype: user
        permissions: rwx
        state: present
